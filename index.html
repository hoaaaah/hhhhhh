<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chào mừng Quốc khánh 2/9</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(to top right, #ff0000, #cc0000);
            color: white;
            font-family: 'Arial', sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 100%;
            height: 100vh;
            text-align: center;
            padding-top: 100px;
        }

        .title {
            font-size: 50px;
            font-weight: bold;
            animation: slideIn 2s ease-out;
            color: #FFD700;
            text-shadow: 2px 2px 8px black;
        }

        .subtitle {
            font-size: 24px;
            margin-top: 20px;
            animation: fadeIn 3s ease-in;
        }

        .flag {
            width: 250px;
            animation: wave 2s infinite ease-in-out;
            margin-top: 40px;
            filter: drop-shadow(2px 2px 5px black);
        }

        /* Pháo hoa đơn giản */
        .firework {
            position: absolute;
            width: 10px;
            height: 10px;
            background: yellow;
            border-radius: 50%;
            animation: explode 2s infinite ease-out;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        @keyframes wave {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(2deg); }
            50% { transform: rotate(-2deg); }
            75% { transform: rotate(2deg); }
            100% { transform: rotate(0deg); }
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }
            100% {
                transform: scale(10);
                opacity: 0;
            }
        }

        footer {
            position: absolute;
            bottom: 10px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            color: #fff;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="title">🇻🇳 Chào mừng Quốc khánh 2/9 🇻🇳</div>
        <div class="subtitle">Kỷ niệm ngày độc lập – Tự hào dân tộc Việt Nam!</div>
        <img src="https://upload.wikimedia.org/wikipedia/commons/2/21/Flag_of_Vietnam.svg" alt="Cờ Việt Nam" class="flag">
    </div>

    <!-- Fireworks - hiệu ứng nền -->
    <div class="firework" style="top: 20%; left: 30%; background: yellow;"></div>
    <div class="firework" style="top: 40%; left: 70%; background: orange;"></div>
    <div class="firework" style="top: 60%; left: 50%; background: red;"></div>
    <div class="firework" style="top: 35%; left: 80%; background: gold;"></div>
    <div class="firework" style="top: 25%; left: 20%; background: white;"></div>

    <footer>
        &copy; 2025 – Thiết kế bởi Người Yêu Nước Việt Nam
    </footer>

</body>
</html>
